name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        # Pinned to a commit of hacs/action (main, 2026-06-08): its latest tag
        # (22.5.0) dates from 2022. The action itself runs the image
        # ghcr.io/hacs/action:main, i.e. HACS' current checks.
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: plugin
